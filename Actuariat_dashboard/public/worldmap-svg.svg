<svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Définitions -->
  <defs>
    <style>
      .continent { fill: #e2e8f0; stroke: #cbd5e1; stroke-width: 0.5; opacity: 0.8; }
      .ocean { fill: #f1f5f9; }
      .grid-line { stroke: #e2e8f0; stroke-width: 0.3; opacity: 0.5; }
    </style>
    
    <!-- Motif de grille -->
    <pattern id="grid" width="50" height="25" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 25" class="grid-line" fill="none"/>
    </pattern>
  </defs>
  
  <!-- Fond océan avec grille -->
  <rect width="100%" height="100%" class="ocean"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  
  <!-- Amérique du Nord -->
  <path d="M 150 80 Q 200 60 250 80 Q 300 70 350 100 Q 320 140 280 130 Q 240 120 200 110 Q 180 100 150 80 Z" class="continent"/>
  <path d="M 180 140 Q 220 130 260 140 Q 240 160 200 150 Q 180 145 180 140 Z" class="continent"/>
  
  <!-- Amérique du Sud -->
  <path d="M 220 200 Q 260 190 300 210 Q 320 250 310 290 Q 290 330 270 340 Q 250 350 230 340 Q 210 330 200 310 Q 190 280 200 250 Q 210 220 220 200 Z" class="continent"/>
  
  <!-- Europe -->
  <path d="M 480 60 Q 520 50 560 60 Q 580 70 600 80 Q 590 100 570 110 Q 550 120 530 115 Q 510 110 490 105 Q 480 85 480 60 Z" class="continent"/>
  
  <!-- Afrique -->
  <path d="M 500 140 Q 540 130 580 150 Q 600 180 590 220 Q 580 260 570 300 Q 560 320 540 330 Q 520 335 500 330 Q 480 320 470 290 Q 460 250 470 210 Q 480 170 500 140 Z" class="continent"/>
  
  <!-- Asie -->
  <path d="M 620 50 Q 680 40 740 60 Q 800 70 850 90 Q 900 100 920 120 Q 910 140 880 150 Q 850 160 820 155 Q 780 150 740 140 Q 700 130 660 120 Q 630 100 620 50 Z" class="continent"/>
  <path d="M 650 160 Q 700 150 750 170 Q 800 180 830 200 Q 820 220 790 230 Q 760 240 730 235 Q 700 230 670 220 Q 650 200 650 160 Z" class="continent"/>
  
  <!-- Australie -->
  <path d="M 750 320 Q 800 310 850 320 Q 870 330 860 350 Q 840 360 810 355 Q 780 350 760 345 Q 750 335 750 320 Z" class="continent"/>
  
  <!-- Groenland -->
  <path d="M 380 20 Q 420 10 450 25 Q 440 45 410 50 Q 390 45 380 20 Z" class="continent"/>
  
  <!-- Lignes de longitude principales -->
  <line x1="500" y1="0" x2="500" y2="500" class="grid-line"/>
  <line x1="250" y1="0" x2="250" y2="500" class="grid-line"/>
  <line x1="750" y1="0" x2="750" y2="500" class="grid-line"/>
  
  <!-- Lignes de latitude principales -->
  <line x1="0" y1="125" x2="1000" y2="125" class="grid-line"/>
  <line x1="0" y1="250" x2="1000" y2="250" class="grid-line"/>
  <line x1="0" y1="375" x2="1000" y2="375" class="grid-line"/>
  
  <!-- Équateur (ligne plus visible) -->
  <line x1="0" y1="250" x2="1000" y2="250" stroke="#94a3b8" stroke-width="1" opacity="0.6" stroke-dasharray="5,5"/>
  
  <!-- Méridien de Greenwich -->
  <line x1="500" y1="0" x2="500" y2="500" stroke="#94a3b8" stroke-width="1" opacity="0.6" stroke-dasharray="5,5"/>
  
  <!-- Labels géographiques (optionnels) -->
  <text x="250" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Amérique</text>
  <text x="540" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Afrique/Europe</text>
  <text x="800" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Asie/Océanie</text>
</svg>
